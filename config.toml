# Настройки алгоритма номограммы LASIK: Alcon WaveLight EX500 + микрокератом Moria M2.
# Биометрия — Nidek AL-Scan, послеоперационная рефракция — Tonoref II (авторефрактометр),
# острота зрения после операции — без коррекции, толщина лоскута — измерена в операционной.

[data]
# Основной файл и дополнительные файлы с новыми пациентами (формат шапки тот же).
# Можно дописывать строки в основной файл или класть новые файлы в папку "данные".
# При повторе пары (id, глаз) берётся запись из файла, указанного позже.
files = ["номограмма.xlsx", "данные/*.xlsx"]
# База, в которую программа сама записывает новых пациентов и контрольные осмотры.
# Перед каждой записью создаётся копия в папке "резервные_копии".
base_file = "номограмма.xlsx"
backups_keep = 50
sheet = 0          # номер листа (0 — первый) или его название
header_rows = 2    # число строк в шапке таблицы

# Сопоставление внутренних полей и заголовков таблицы.
# Двухуровневый заголовок пишется как "группа|подзаголовок" (регистр и лишние пробелы не важны).
# Чтобы добавить новый признак: добавьте колонку в Excel, пропишите её здесь
# и внесите имя поля в списки признаков в разделе [model].
[columns]
id = "id"
age = "полных лет"
eye = "глаз"
pre_sph = "до операции|shp субьктивно"
pre_cyl = "до операции|cyl"
pre_axis = "до операции|axis"
pre_cdva = "до операции|зрение с коррекцией"
k1 = "до операции|k1"
k1_axis = "до операции|k1 axis"
k2 = "до операции|k2"
k2_axis = "до операции|k2 axis"
al = "до операции|al"
acd = "до операции|acd"
pachy = "до операции|pahymerty"
pupil = "до операции|диамтер зрачка"
plan_sph = "запланировано в лазере|sph"
plan_cyl = "запланировано в лазере|cyl"
plan_axis = "запланировано в лазере|axis"
protocol = "запланировано в лазере|протокол"
oz = "запланировано в лазере|optical zone"
flap = "flap"
comment = "коментарий"
# Рефракция, измеренная прибором InnovEyes (протокол WLP — WaveLight Plus).
# Колонки программа добавит в конец таблицы сама, когда появится первый пациент с этими данными.
ie_sph = "до операции|innoveyes sph"
ie_cyl = "до операции|innoveyes cyl"
ie_axis = "до операции|innoveyes axis"
# Цель, под которую рассчитана программа лазера (указание хирурга), и срок, на который она задана
target_M = "цель сф. экв."
target_months = "срок цели, мес"
# Служебные колонки: программа сама добавит их в конец таблицы при первой записи
status = "статус"
surgery_date = "дата операции"
calc_date = "дата расчёта"
recommendation = "рекомендация программы"

# Подзаголовки внутри блока каждого визита
[visit_columns]
sph = "shp"
cyl = "cyl"
axis = "axis"
ucva = "зрение без коррекции"

# Визиты: заголовок блока в таблице = срок после операции в месяцах.
# "после операции" — ранний осмотр; по умолчанию считается 1-е сутки (0.033 мес).
# Если осмотр проводится в другой срок — исправьте значение. Новый визит (например "18 мес")
# достаточно добавить сюда и в таблицу.
[visits]
"после операции" = 0.033
"1 мес" = 1
"3 мес" = 3
"6 мес" = 6
"9 мес" = 9
"12 мес" = 12

# Приведение написаний к единому виду (ключ — в нижнем регистре)
[aliases.eye]
od = "OD"
os = "OS"

[aliases.protocol]
"custom-q" = "Custom-Q"
"customq" = "Custom-Q"
wfo = "WFO"
who = "WFO"
wlp = "WLP"
"wavelight plus" = "WLP"
"wavelight+" = "WLP"
"wl plus" = "WLP"
"wl+" = "WLP"

[validation]
# Глаза с непустым комментарием (осложнения: десквамация эпителия, рубец...) не используются в обучении
exclude_eyes_with_comment = true
# Пациенты, рассчитанные в программе, но ещё не прооперированные, в обучении не участвуют
exclude_status = ["запланирован"]
# Визит считается недостоверным, если |сф. эквивалент| >= порога при остроте без коррекции >= порога
suspicious_postop_M = 2.0
suspicious_postop_ucva = 0.8

# Допустимые диапазоны. Значение вне диапазона считается ошибкой ввода и не используется.
[validation.ranges]
age = [16, 70]
pre_sph = [-15, 10]
pre_cyl = [-7, 7]
pre_axis = [0, 180]
pre_cdva = [0.05, 2.0]
k1 = [37, 50]
k2 = [37, 52]
k1_axis = [0, 180]
k2_axis = [0, 180]
al = [20, 31]
acd = [2.0, 5.5]
pachy = [420, 700]
pupil = [2, 10]
plan_sph = [-15, 10]
plan_cyl = [-7, 7]
plan_axis = [0, 180]
oz = [5.5, 7.5]
flap = [60, 200]
ie_sph = [-15, 10]
ie_cyl = [-7, 7]
ie_axis = [0, 180]
target_M = [-4, 2]
target_months = [0, 24]
visit_sph = [-10, 10]
visit_cyl = [-7, 7]
visit_axis = [0, 180]
visit_ucva = [0.01, 2.0]

[model]
# Кандидаты: "ridge" (гребневая регрессия), "huber" (устойчивая к выбросам регрессия),
# "gbm" (градиентный бустинг — имеет смысл при > ~1000 глаз). Лучший выбирается по кросс-валидации.
candidates = ["ridge", "huber"]
cv_folds = 5
# Метрики "на сроке" считаются по визитам не раньше этого срока (мес)
late_months = 1

# Признаки. Модель предсказывает отклонение результата от "идеального" (послеоп. = до операции − план).
# Доступны: исходные поля из [columns], вычисленные pre_M, pre_J0, pre_J45, plan_M, plan_J0, plan_J45,
# plan_Cabs (модуль цилиндра плана), k_mean, corneal_J0, corneal_J45 (роговичный астигматизм по кератометрии),
# ora_J0, ora_J45 (рефракционный минус роговичный), hyper (1 — гиперметропия),
# log_t (логарифм срока), pre_cdva_logmar (острота с коррекцией до операции в logMAR),
# ie_dM, ie_dJ0, ie_dJ45 (рефракция InnovEyes минус субъективная; 0, если InnovEyes не измерялся),
# "a*b" — произведение, "поле=значение" — индикатор категории.
# Признаки "protocol=WLP" и ie_* начнут влиять на расчёт сами, когда в базе появятся
# прооперированные по WLP глаза с контрольными осмотрами и модель будет переобучена.
features_M = [
  "plan_M", "plan_Cabs", "log_t", "plan_M*log_t", "age", "plan_M*age",
  "k_mean", "pachy", "flap", "oz", "pupil", "al", "acd",
  "protocol=WFO", "protocol=WLP", "ie_dM", "hyper", "plan_M*hyper", "eye=OS",
]
# pre_cdva_logmar в модели сфероэквивалента на данных 09.2026 ухудшал точность (0.483 против 0.473 D),
# поэтому не включён; острота с коррекцией используется в моделях астигматизма и остроты без коррекции.
# Астигматизм: в модели участвуют и рефракционный (pre_J*), и роговичный (corneal_J*) астигматизм —
# так программа различает, какую его часть устраняет лазер (на данных 09.2026 это снизило ошибку
# прогноза J0 с 0.145 до 0.137 D и J45 с 0.117 до 0.108 D).
features_J0 = ["plan_J0", "plan_J45", "pre_J0", "corneal_J0", "log_t", "plan_J0*log_t",
               "protocol=WFO", "protocol=WLP", "ie_dJ0", "age", "pre_cdva_logmar"]
features_J45 = ["plan_J45", "plan_J0", "pre_J45", "corneal_J45", "log_t", "plan_J45*log_t",
                "protocol=WFO", "protocol=WLP", "ie_dJ45", "age", "pre_cdva_logmar"]

[planning]
# Протоколы, доступные для выбора при расчёте (в том числе ещё не встречавшиеся в обучении)
protocols = ["Custom-Q", "WFO", "WLP"]
min_protocol_eyes = 30 # меньше глаз с этим протоколом в обучении — предупреждать о ненадёжности поправки
target_M = 0.0         # целевая рефракция (сф. эквивалент) по умолчанию, если не задана у пациента
horizon_months = 3     # на какой срок оптимизируется результат
step = 0.25            # шаг ввода в лазер, D
sph_search = 2.0       # поиск сферы в пределах ± от субъективной рефракции, D
cyl_search = 1.0       # насколько цилиндр ввода может быть меньше субъективного, D
cyl_increase = 0.5     # насколько цилиндр ввода может быть больше субъективного, D (в ваших данных
                       # хирург почти никогда не усиливал цилиндр больше чем на 0.5 D — дальше прогноз ненадёжен)
# Роговичный астигматизм: ось ввода подбирается на дуге между осью субъективной рефракции и
# плоской осью роговицы (K1/K2), величина цилиндра — в пределах cyl_search / cyl_increase; при нулевом субъективном
# цилиндре цилиндр может быть предложен по роговице. false — ось всегда как в субъективной рефракции.
use_corneal_astigmatism = true
axis_step = 5          # шаг подбора оси, °
corneal_min_cyl = 0.25 # роговичный астигматизм меньше этого — его ось не используется, D
k_axes_tolerance = 20  # допустимое отклонение осей K1 и K2 от перпендикулярности, °
max_ora = 1.25         # предупреждение: расхождение рефракционного и роговичного астигматизма больше, D
axis_shift_warn = 15   # предупреждение: ось ввода отличается от субъективной на столько и более, °
ie_max_diff = 0.5      # предупреждение: InnovEyes и субъективная рефракция расходятся на столько и более, D
# Критерий подбора ввода:
#  "se"   — цель есть прямое указание программе: сначала подбираются цилиндр и ось (минимум
#           остаточного астигматизма), затем сфера — так, чтобы прогнозный сфероэквивалент на
#           заданный срок был как можно ближе к цели (например, +0.25 через 3 мес);
#  "ucva" — максимальная прогнозная острота без коррекции (только при цели 0; сфероэквивалент
#           при этом может немного отличаться от цели).
criterion = "se"
se_weight_ucva = 0.05  # для "ucva": дополнительная тяга сфероэквивалента к цели
# «Цена» отхода цилиндра/оси ввода от субъективной рефракции. Чем больше, тем реже программа меняет
# цилиндр и ось (0 — менять при любом, даже ничтожном, прогнозном выигрыше).
cyl_change_weight = 0.1
default_flap = 110     # ожидаемый лоскут, мкм (если не указан)
min_rsb_um = 300       # предупреждение: остаточное стромальное ложе меньше, мкм
max_pta = 0.40         # предупреждение: доля изменённой ткани (лоскут + абляция) / пахиметрия
min_hyperopes = 30     # меньше гиперметропов в обучении — предупреждать о ненадёжности

[table]
ages = [20, 25, 30, 35, 40, 45]
sph_values = [-1, -1.5, -2, -2.5, -3, -3.5, -4, -4.5, -5, -5.5, -6, -6.5, -7, -7.5, -8, -9, -10, 1, 2, 3, 4, 5]
cyl_values = [-0.5, -0.75, -1, -1.25, -1.5, -2, -2.5, -3, -3.5, -4]
cyl_table_sph = [-1, -3, -5]
